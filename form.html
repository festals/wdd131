<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Form Assignment</title>
        <meta name="description" content="Form Assignments to review a product for wdd 131 course by Sophie Festal">
        <meta name="author" content="Sophie Festal">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;400&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles/form.css">
        <script defer src="scripts/form.js"></script>
        <script defer src="scripts/getdates.js"></script>
    </head>
    <body>
        <header>
            <h1>Review</h1>
        </header>
        <main>
            <form method="get" action="review.html" class="form1">
                <fieldset>
                    <label>Product Name
                        <select id="productSelect" name="product" required>
                            <option value="" disabled selected>Select a Product ...  </option>
                        </select>
                    </label>
                </fieldset>
                
                <fieldset>
                    <label>Overall Rating</label>
                    <div class="radio_star">
                        <label><span>☆</span><input type="radio" name="star" id="star1" required></label>
                        <label><span>&star;&star;</span><input type="radio" name="star" id="star2" required></label>
                        <label><span>&star;&star;&star;</span><input type="radio" name="star" id="star3" required></label>
                        <label><span>&star;&star;&star;&star;</span><input type="radio" name="star" id="star4" required></label>
                        <label><span>&star;&star;&star;&star;&star;</span><input type="radio" name="star" id="star5" required></label>
                    </div>
                </fieldset>

                <fieldset>
                    <label>Date of Installation</label><input type="date" name="completeDate" id="date" required>
                </fieldset>

                <fieldset>
                    <label>Wich features did you find useful in the product?<br><span class="check">(check all that apply)</span></label>
                    <label><input type="checkbox" name="durability" id="durability" value="yes">Durability</label>
                    <label><input type="checkbox" name="ease" id="ease" value="yes">Ease of Use</label>
                    <label><input type="checkbox" name="performance" id="perf" value="yes">Performance</label>
                    <label><input type="checkbox" name="design" id="design" value="yes">Design</label>
                </fieldset>

                <fieldset>
                    <label>Written Review <span class="optional">(Optional)</span></label>
                    <textarea id="review" name="review" rows="10" cols="70"></textarea>
                </fieldset>

                <fieldset>
                    <label>Your Name <span class="optional">(Optional)</span></label>
                    <input type="text" id="name" name="name">
                </fieldset>

                <input type="submit" value="Post Review">

            </form>
        </main>
        <footer>
            <p>
                ©️<span id="currentyear"></span> | Sophie Festal | FRANCE
            </p>
            <p>Last modification: <span id="lastModified"></span></p>
        </footer>
    </body>
</html>
